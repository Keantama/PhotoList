<!DOCTYPE html>
<html>
<head>
    <title>Photo Notes</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
            background-color: #1e1e2f;
            color: #f0f0f0;
        }

        h1 {
            text-align: center;
            font-size: 3em;
            background: linear-gradient(to right, #007bff, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-bar span {
            font-size: 1.1em;
        }

        a.logout {
            color: #f99;
            text-decoration: none;
            font-weight: bold;
        }

        form {
            background: #2c2c3e;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        input, textarea, button {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background-color: #3a3a4f;
            color: #fff;
        }

        button {
            background-color: #007bff;
            cursor: pointer;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #2c2c3e;
            padding: 15px;
            border-radius: 10px;
        }

        .image-box img {
            max-width: 200px;
            border-radius: 8px;
        }

        .note-box {
            flex: 1;
            background-color: #1e1e2f;
            padding: 10px 15px;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>Welcome, {{ username }}</span>
        <a href="{{ url_for('logout') }}" class="logout">Logout</a>
    </div>

    <h1>📝 Photo Notes</h1>

    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="photo" required>
        <textarea name="note" placeholder="Enter your note..." rows="4" required></textarea>
        <button type="submit">Save</button>
    </form>

    <div class="grid-container">
        {% for image, note in photo_notes %}
        <div class="row">
            <div class="image-box">
                <img src="{{ url_for('static', filename='uploads/' + image) }}" alt="Uploaded Image">
            </div>
            <div class="note-box">{{ note }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
